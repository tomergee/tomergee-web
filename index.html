<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tomer Glottmann</title>
<meta name="description" content="Tomer Glottmann — software engineering tech lead, AI agents infrastructure at Google.">
<link rel="canonical" href="https://tomergee.com/">
<meta property="og:title" content="Tomer Glottmann">
<meta property="og:description" content="Software engineering tech lead, AI agents infrastructure at Google.">
<meta property="og:url" content="https://tomergee.com/">
<meta property="og:type" content="website">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌐</text></svg>">
<style>
  :root {
    --bg: #fbfaf8;
    --fg: #16150f;
    --muted: #6b6862;
    --rule: #e4e0d8;
    --accent: #2f6f4e;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12120f;
      --fg: #eceae4;
      --muted: #979489;
      --rule: #2b2a25;
      --accent: #7fc79c;
    }
  }

  * { box-sizing: border-box; }

  html { -webkit-text-size-adjust: 100%; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem 1.5rem;
    background: var(--bg);
    color: var(--fg);
    font: 400 17px/1.6 ui-serif, Georgia, "Times New Roman", serif;
    -webkit-font-smoothing: antialiased;
  }

  main {
    width: 100%;
    max-width: 30rem;
  }

  h1 {
    margin: 0;
    font-size: clamp(2.1rem, 8vw, 3rem);
    font-weight: 500;
    letter-spacing: -0.02em;
  }

  .tagline {
    margin: 0.6rem 0 0;
    color: var(--muted);
    font-size: 1.05rem;
  }

  nav {
    margin-top: 2.5rem;
    border-top: 1px solid var(--rule);
  }

  nav a {
    display: flex;
    align-items: baseline;
    gap: 1rem;
    padding: 1rem 0.25rem;
    border-bottom: 1px solid var(--rule);
    color: inherit;
    text-decoration: none;
    transition: padding-left 0.18s ease, color 0.18s ease;
  }

  nav a:hover,
  nav a:focus-visible {
    padding-left: 0.75rem;
    color: var(--accent);
  }

  nav a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 3px;
    border-radius: 3px;
  }

  .label { font-weight: 500; }

  .detail {
    margin-left: auto;
    color: var(--muted);
    font-size: 0.92rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  nav a:hover .detail,
  nav a:focus-visible .detail { color: var(--accent); }

  footer {
    margin-top: 2.5rem;
    color: var(--muted);
    font-size: 0.85rem;
  }

  @media (prefers-reduced-motion: reduce) {
    nav a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <h1>Tomer Glottmann</h1>
  <p class="tagline">Software engineering tech lead — AI agents infrastructure at Google.</p>

  <nav aria-label="Links">
    <a href="https://github.com/tomergee">
      <span class="label">GitHub</span>
      <span class="detail">@tomergee</span>
    </a>
    <a href="https://www.linkedin.com/in/tomerglottman/">
      <span class="label">LinkedIn</span>
      <span class="detail">/in/tomerglottman</span>
    </a>
    <a href="/yosemite/">
      <span class="label">Yosemite Field Plan</span>
      <span class="detail">trip doc</span>
    </a>
  </nav>

  <footer>tomergee.com</footer>
</main>
</body>
</html>
